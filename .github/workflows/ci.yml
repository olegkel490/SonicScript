name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # "Release erstellen"-Button: Actions → CI → Run workflow → Version eingeben (z. B. 0.1.1).
  # Baut main, legt den Tag v<Version> an und veröffentlicht das Release mit der .exe.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne "v", z. B. 0.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check release input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases nur von main (gewählt: $GITHUB_REF)."; exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version '$VERSION' – erwartet z. B. 0.1.1"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Secret hygiene scan
        shell: bash
        run: |
          pattern="$(grep -vE '^[[:space:]]*(#|$)' .github/secret-scan-patterns.txt | paste -sd'|' -)"
          if grep -RInE --exclude-dir=.git --exclude=secret-scan-patterns.txt "$pattern" .; then
            echo "Potential secret found."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SonicScript.slnx

      - name: Build
        run: dotnet build SonicScript.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/SonicScript.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: UI tests (headless)
        run: dotnet test tests/SonicScript.App.Tests -c Release --no-build --logger "trx;LogFileName=ui-results.trx"

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            v="$INPUT_VERSION"; release=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; release=true
          else
            v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; release=false
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Publish single-file exe
        run: >
          dotnet publish src/SonicScript.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.value }} -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: SonicScript-win-x64
          path: dist/SonicScript.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tag must be new (button)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existiert bereits – bitte eine neue Version wählen."; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: SonicScript-win-x64
          path: dist
      - name: Checksum
        run: cd dist && sha256sum SonicScript.exe > SonicScript.exe.sha256
      # Legt beim Button den Tag auf dem gebauten Commit an. Mit dem GITHUB_TOKEN erstellte Tags lösen
      # keinen weiteren Workflow-Lauf aus, es entsteht also kein doppeltes Release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          files: |
            dist/SonicScript.exe
            dist/SonicScript.exe.sha256
          generate_release_notes: true
